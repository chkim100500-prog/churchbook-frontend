<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 설정 - ChurchBook</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    color: #1f2937;
  }
  p.desc {
    font-size: 13px;
    color: #6b7280;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: default; }
  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .msg.error { background: #fef2f2; color: #b91c1c; display: block; }
  .msg.success { background: #f0fdf4; color: #15803d; display: block; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: -8px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 결재 비밀번호 설정</h1>
    <p class="desc" id="descText">새로 사용할 비밀번호를 입력해주세요.</p>

    <form id="resetForm">
      <label for="pw1">새 비밀번호</label>
      <input type="password" id="pw1" autocomplete="new-password">
      <p class="hint">4자 이상 입력하세요.</p>

      <label for="pw2">새 비밀번호 확인</label>
      <input type="password" id="pw2" autocomplete="new-password">

      <button type="submit" id="submitBtn">비밀번호 설정</button>
    </form>

    <div class="msg" id="msgBox"></div>
  </div>

<script>
  const API_BASE_URL = 'https://churchbook-backend-production.up.railway.app';

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  const sid = getParam('sid');
  const phone = getParam('phone');
  const token = getParam('token');

  const msgBox = document.getElementById('msgBox');
  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  if (!sid || !phone || !token) {
    form.style.display = 'none';
    showMsg('링크가 올바르지 않습니다. 이메일에 있는 링크를 다시 확인해주세요.', 'error');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (!pw1 || pw1.length < 4) {
      showMsg('비밀번호는 4자 이상이어야 합니다.', 'error');
      return;
    }
    if (pw1 !== pw2) {
      showMsg('비밀번호가 서로 일치하지 않습니다.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '처리 중...';

    try {
      const res = await fetch(API_BASE_URL + '/api/approvals/public/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spreadsheetId: sid, phone, token, newPassword: pw1 }),
      });
      const data = await res.json();
      if (data.success) {
        form.style.display = 'none';
        showMsg('비밀번호가 설정되었습니다. 이제 앱에서 새 비밀번호로 결재 인증을 하실 수 있습니다.', 'success');
      } else {
        showMsg(data.message || '설정에 실패했습니다. 링크가 만료되었을 수 있습니다.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '비밀번호 설정';
      }
    } catch (err) {
      showMsg('일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = '비밀번호 설정';
    }
  });
</script>
</body>
</html>
